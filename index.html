<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Den-Byte</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Birthstone&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amarante&family=Birthstone&family=Faculty+Glyphic&family=Outfit:wght@100..900&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header
      class="fixed top-0 left-0 w-full h-10 bg-white/70 z-50 backdrop-blur-xs border-b border-gray-300"
    >
      <div
        class="flex justify-between text-xs text-gray-600 w-[50%] items-center w-[50%] mx-auto h-full"
      >
        <div class="fName font-semibold text-sm">OT.</div>
        <div class="flex gap-[10px] items-center">
          <div><a href="#">Experience</a></div>
          <div><a href="#">Projects</a></div>
          <div><a href="#">Stack</a></div>
          <div><a href="#">Contact</a></div>
          <div
            class="flex gap-[8px] border border-gray-300 bg-gray-200 rounded overflow-hidden p-[1px]"
          >
            <div class="bg-gray-400 px-[3px] rounded">
              <i class="fa-solid fa-circle-half-stroke text-[8px]"></i>
            </div>
            <div class="px-[3px] rounded">
              <i class="fa-solid fa-display text-[8px]"></i>
            </div>
            <div class="px-[3px] rounded">
              <i class="fa-regular fa-moon text-[8px]"></i>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div class="pt-15 pb-1000 w-[50%] mx-auto flex justify-between">
      <div class="flex items-end gap-3">
        <div class="relative">
          <div
            class="w-[50px] h-[50px] bg-gray-400 rounded-full overflow-hidden"
          ></div>
          <div
            class="h-[7px] w-[7px] rounded-full bg-green-600 absolute bottom-1 right-0.5 border-[1.5px] border-white animate-pulse"
          ></div>
        </div>
        <div>
          <h3>Oyaniyi Timilehin</h3>
          <p class="text-[10px] text-gray-500">
            Frontend Developer & Aspiring Full-Stack Developer
          </p>
        </div>
      </div>
      <div
        class="bg-green-50 h-[50%] text-[9px] py-1 px-3 border border-green-300 rounded-full text-green-600 flex items-center gap-2"
      >
        <div
          class="h-[5px] w-[5px] rounded-full bg-green-600 animate-ping"
        ></div>
        <div>available for work</div>
      </div>
    </div>
  </body>
</html>
